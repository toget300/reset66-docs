<h1>重啟66</h1><p>用 66 天，一天打倒一隻壞習慣怪獸。</p>
<h2>常見問題</h2>
<p><b>換手機時進度會保留嗎？</b><br>目前進度存在手機本機，換手機或刪除 App 會重新開始。之後的版本會加入雲端備份。</p>
<p><b>為什麼任務按不下去？</b><br>每個任務有開放時段，請在時段內完成並驗證（計時、拍照或填寫）。</p>
<p><b>沒打倒怪獸會怎樣？</b><br>隔天要重打同一隻，大魔王決戰日也會延後一天。</p>
